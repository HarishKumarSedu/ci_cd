name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  compile-app:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: 3.8
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python app.py
name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  compile-app-ubuntu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # If your script requires third-party packages, install them here
        # Example: pip install pytest ruff
        
    - name: Run application script
      run: python app.py
  compile-app-windows:
  
    runs-on: windows-latest
    depends-on: compile-app-ubuntu
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # If your script requires third-party packages, install them here
        # Example: pip install pytest ruff
        
    - name: Run application script
      run: python app.py
